<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            font-family: "Courier New", Courier, monospace;
            color: #00ff41;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        /* =====================================================
           MATRIX SCANLINES
        ===================================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 255, 65, 0.03) 0px,
                    rgba(0, 255, 65, 0.03) 1px,
                    transparent 2px,
                    transparent 4px
                );

            z-index: 999;
        }

        /* =====================================================
           PORTFOLIO
        ===================================================== */

        .container {
            width: min(1000px, 100%);
            min-height: 100vh;
            margin: auto;
            padding: 40px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* =====================================================
           TITLE
        ===================================================== */

        h1 {
            margin: 0 0 60px;

            font-size: clamp(
                35px,
                6vw,
                65px
            );

            letter-spacing: 12px;
            font-style: italic;

            text-shadow:
                0 0 5px #00ff41,
                0 0 15px #00ff41,
                0 0 30px #00ff41;
        }

        /* =====================================================
           TERMINAL TEXT
        ===================================================== */

        .terminal-text {
            min-height: 22px;
            margin-bottom: 55px;

            font-size: 14px;
            letter-spacing: 2px;

            text-shadow:
                0 0 8px #00ff41;
        }

        /* =====================================================
           FOLDERS
        ===================================================== */

        .folders {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 60px 40px;

            justify-items: center;
            width: 100%;
        }

        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 180px;
        }

        /* =====================================================
           FOLDER ICON
        ===================================================== */

        .folder-icon {
            position: relative;

            width: 130px;
            height: 90px;

            border: 2px solid #00ff41;
            border-radius: 5px;

            cursor: pointer;

            box-shadow:
                0 0 8px #00ff41,
                inset 0 0 15px
                rgba(0, 255, 65, 0.08);
        }

        .folder-icon::before {
            content: "";

            position: absolute;

            width: 50px;
            height: 18px;

            top: -18px;
            left: 10px;

            border: 2px solid #00ff41;
            border-bottom: none;

            border-radius:
                5px 5px 0 0;

            background: #000;

            box-shadow:
                0 -3px 10px
                rgba(0, 255, 65, 0.3);
        }

        .folder-icon::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 255, 65, 0.15),
                    transparent 60%
                );

            opacity: 0;
        }

        .folder-item:hover .folder-icon {
            transform:
                translateY(-8px)
                scale(1.05);

            background:
                rgba(0, 255, 65, 0.1);

            box-shadow:
                0 0 15px #00ff41,
                0 0 35px #00ff41,
                0 0 70px
                rgba(0, 255, 65, 0.5),
                inset 0 0 25px
                rgba(0, 255, 65, 0.15);
        }

        .folder-item:hover .folder-icon::after {
            opacity: 1;
        }

        /* =====================================================
           FOLDER NAME
        ===================================================== */

        .folder-name {
            margin-top: 25px;

            color: #00ff41;

            text-decoration: underline;

            font-size: 15px;
            font-weight: bold;

            letter-spacing: 2px;

            text-shadow:
                0 0 5px #00ff41,
                0 0 12px #00ff41;
        }

        .folder-name:hover {
            color: #fff;

            text-shadow:
                0 0 8px #00ff41,
                0 0 20px #00ff41,
                0 0 35px #00ff41;
        }

        .folder-name::before {
            content: "> ";
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 70px;

            font-size: 12px;
            letter-spacing: 2px;

            opacity: 0.6;
        }

        /* =====================================================
           X BUTTON
        ===================================================== */

        .shutdown-button {
            position: fixed;

            top: 25px;
            right: 30px;

            width: 45px;
            height: 45px;

            border: 2px solid #00ff41;

            background: #000;
            color: #00ff41;

            font-family:
                "Courier New",
                monospace;

            font-size: 22px;

            cursor: pointer;

            z-index: 100;

            text-shadow:
                0 0 8px #00ff41;

            box-shadow:
                0 0 8px #00ff41,
                inset 0 0 8px
                rgba(0, 255, 65, 0.1);

            transition: 0.2s ease;
        }

        .shutdown-button:hover {
            background: #00ff41;
            color: #000;

            box-shadow:
                0 0 15px #00ff41,
                0 0 35px #00ff41;
        }

        /* =====================================================
           SHUTDOWN OVERLAY
        ===================================================== */

        .shutdown-overlay {
            position: fixed;
            inset: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                rgba(0, 0, 0, 0.85);

            z-index: 300;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .shutdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* =====================================================
           SHUTDOWN BOX
        ===================================================== */

        .shutdown-box {
            width: min(500px, 90%);

            border: 2px solid #00ff41;

            padding: 35px 30px;

            background: #000;

            text-align: center;

            opacity: 0;
            transform: scale(0.2);

            box-shadow:
                0 0 10px #00ff41,
                0 0 30px
                rgba(0, 255, 65, 0.4),
                inset 0 0 20px
                rgba(0, 255, 65, 0.08);
        }

        .shutdown-overlay.active .shutdown-box {
            animation:
                popupBoot
                0.55s
                cubic-bezier(
                    0.17,
                    0.67,
                    0.3,
                    1.25
                )
                forwards;
        }

        @keyframes popupBoot {

            0% {
                opacity: 0;
                transform: scale(0.2);
                filter: brightness(3);
            }

            40% {
                opacity: 1;
                transform: scale(1.08);

                filter: brightness(2);

                box-shadow:
                    0 0 30px #00ff41,
                    0 0 70px
                    rgba(0, 255, 65, 0.8);
            }

            70% {
                transform: scale(0.97);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        /* =====================================================
           SHUTDOWN TEXT
        ===================================================== */

        .shutdown-title {
            font-size: 18px;

            letter-spacing: 2px;

            margin-bottom: 30px;

            text-shadow:
                0 0 5px #00ff41,
                0 0 15px #00ff41;
        }

        /* =====================================================
           SHUTDOWN BUTTONS
        ===================================================== */

        .shutdown-buttons {
            display: flex;

            justify-content: center;

            gap: 25px;
        }

        .shutdown-buttons button {
            width: 110px;

            padding: 10px;

            background: #000;

            border: 1px solid #00ff41;

            color: #00ff41;

            font-family:
                "Courier New",
                monospace;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s ease;

            box-shadow:
                0 0 8px
                rgba(0, 255, 65, 0.4);
        }

        .shutdown-buttons button:hover {
            background: #00ff41;
            color: #000;

            box-shadow:
                0 0 15px #00ff41,
                0 0 30px #00ff41;
        }

        /* =====================================================
           SHUTDOWN ANIMATION
        ===================================================== */

        .shutdown-animation {
            animation:
                disappear
                0.6s
                ease
                forwards;
        }

        @keyframes disappear {

            0% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    brightness(1);
            }

            35% {
                filter:
                    brightness(3);
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-25px)
                    scale(0.85);

                filter:
                    brightness(0);
            }
        }

        /* =====================================================
           FINAL SCREEN
        ===================================================== */

        .final-screen {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 1000;

            opacity: 0;
            visibility: hidden;
        }

        .final-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .final-message {
            font-size:
                clamp(
                    18px,
                    4vw,
                    30px
                );

            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 0 5px #00ff41,
                0 0 15px #00ff41,
                0 0 30px #00ff41;
        }

        /* =====================================================
           FINAL MESSAGE CURSOR
        ===================================================== */

        .cursor {
            display: inline-block;

            width: 10px;
            height: 25px;

            background: #00ff41;

            margin-left: 5px;

            animation:
                blink
                0.7s
                infinite;

            vertical-align: middle;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .folders {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 55px 20px;
            }

            .folder-icon {
                width: 110px;
                height: 75px;
            }

            .folder-item {
                width: 140px;
            }

            h1 {
                letter-spacing: 7px;
                margin-bottom: 45px;
            }
        }

        @media (max-width: 420px) {

            .folders {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <!-- =====================================================
         X BUTTON
    ===================================================== -->

    <button
        class="shutdown-button"
        id="shutdownButton">

        X

    </button>


    <!-- =====================================================
         PORTFOLIO
    ===================================================== -->

    <div
        class="container"
        id="portfolio">

        <h1>
            PORTFOLIO
        </h1>


        <div
            class="terminal-text">

            > PROJECT DIRECTORY LOADED...

        </div>


        <div class="folders">

            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project1.html"
                    class="folder-name">

                    PROJECT 01

                </a>

            </div>


            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project2.html"
                    class="folder-name">

                    PROJECT 02

                </a>

            </div>


            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project3.html"
                    class="folder-name">

                    PROJECT 03

                </a>

            </div>


            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project4.html"
                    class="folder-name">

                    PROJECT 04

                </a>

            </div>


            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project5.html"
                    class="folder-name">

                    PROJECT 05

                </a>

            </div>


            <div class="folder-item">

                <div class="folder-icon"></div>

                <a
                    href="project6.html"
                    class="folder-name">

                    PROJECT 06

                </a>

            </div>

        </div>


        <div class="footer">

            $ SELECT A DIRECTORY TO OPEN

        </div>

    </div>


    <!-- =====================================================
         SHUTDOWN POPUP
    ===================================================== -->

    <div
        class="shutdown-overlay"
        id="shutdownOverlay">

        <div class="shutdown-box">

            <div class="shutdown-title">

                &gt; ARE YOU SURE DO YOU WANT
                <br>
                TO SHUT DOWN THE SYSTEM?

            </div>


            <div class="shutdown-buttons">

                <button id="cancelButton">
                    CANCEL
                </button>

                <button id="yesButton">
                    YES
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FINAL SCREEN
    ===================================================== -->

    <div
        class="final-screen"
        id="finalScreen">

        <div class="final-message">

            <span id="typingText"></span>

            <span class="cursor"></span>

        </div>

    </div>


    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const shutdownButton =
            document.getElementById(
                "shutdownButton"
            );

        const shutdownOverlay =
            document.getElementById(
                "shutdownOverlay"
            );

        const cancelButton =
            document.getElementById(
                "cancelButton"
            );

        const yesButton =
            document.getElementById(
                "yesButton"
            );

        const portfolio =
            document.getElementById(
                "portfolio"
            );

        const finalScreen =
            document.getElementById(
                "finalScreen"
            );

        const typingText =
            document.getElementById(
                "typingText"
            );


        /* =====================================================
           OPEN SHUTDOWN POPUP
        ===================================================== */

        shutdownButton.addEventListener(
            "click",
            () => {

                shutdownOverlay.classList.add(
                    "active"
                );

            }
        );


        /* =====================================================
           CANCEL
        ===================================================== */

        cancelButton.addEventListener(
            "click",
            () => {

                shutdownOverlay.classList.remove(
                    "active"
                );

            }
        );


        /* =====================================================
           YES
        ===================================================== */

        yesButton.addEventListener(
            "click",
            () => {

                shutdownOverlay.classList.remove(
                    "active"
                );

                shutdownButton.style.pointerEvents =
                    "none";

                startShutdown();

            }
        );


        /* =====================================================
           SHUTDOWN ANIMATION
        ===================================================== */

        function startShutdown() {

            const elements = [

                portfolio.querySelector("h1"),

                portfolio.querySelector(
                    ".terminal-text"
                ),

                ...portfolio.querySelectorAll(
                    ".folder-item"
                ),

                portfolio.querySelector(
                    ".footer"
                )

            ];


            let delay = 0;


            elements.forEach(
                (element) => {

                    setTimeout(
                        () => {

                            element.classList.add(
                                "shutdown-animation"
                            );

                        },
                        delay
                    );

                    delay += 350;

                }
            );


            /*
                Wait until all portfolio
                elements have disappeared.
            */

            setTimeout(
                () => {

                    portfolio.style.display =
                        "none";

                    shutdownButton.style.display =
                        "none";

                    document.body.style.background =
                        "#000";


                    /*
                        Wait 3 seconds before
                        showing final message.
                    */

                    setTimeout(
                        () => {

                            showFinalMessage();

                        },
                        3000
                    );

                },

                delay + 700
            );

        }


        /* =====================================================
           FINAL MESSAGE
        ===================================================== */

        function showFinalMessage() {

            finalScreen.classList.add(
                "active"
            );


            const message =
                "that's all. thank you :)";


            let index = 0;


            typingText.textContent = "";


            function typeCharacter() {

                if (
                    index < message.length
                ) {

                    typingText.textContent +=
                        message.charAt(index);

                    index++;


                    setTimeout(
                        typeCharacter,
                        100
                    );

                }

            }


            typeCharacter();

        }

    </script>

</body>

</html>
