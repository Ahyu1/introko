<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project 01</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: "Courier New", Courier, monospace;
        background-color: #000;
        color: #ff003c;
    }

    /* BLACK GRID BACKGROUND */
    body {
        min-height: 100vh;
        background-color: #000;
        background-image:
            linear-gradient(rgba(255, 0, 60, 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 0, 60, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        padding: 30px;
    }

    /* BACK BUTTON */
    .back-button {
        position: absolute;
        top: 30px;
        left: 30px;

        width: 50px;
        height: 50px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-decoration: none;
        color: #ff003c;
        background: #000;

        border: 2px solid #ff003c;
        border-radius: 5px;

        font-size: 28px;
        font-weight: bold;

        text-shadow:
            0 0 5px #ff003c,
            0 0 10px #ff003c;

        box-shadow:
            0 0 8px #ff003c,
            inset 0 0 10px rgba(255, 0, 60, 0.15);

        transition: 0.2s ease;
    }

    .back-button:hover {
        background: #ff003c;
        color: #000;

        text-shadow: none;

        box-shadow:
            0 0 10px #ff003c,
            0 0 30px #ff003c,
            0 0 60px rgba(255, 0, 60, 0.6);

        transform: scale(1.08);
    }

    /* MAIN CONTENT */
    .container {
        min-height: calc(100vh - 60px);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
    }

    /* NEON RED HEADING */
    h1 {
        margin: 0 0 40px;

        color: #ff003c;
        font-size: clamp(35px, 6vw, 70px);
        font-style: italic;
        letter-spacing: 10px;

        text-shadow:
            0 0 5px #ff003c,
            0 0 15px #ff003c,
            0 0 30px #ff003c,
            0 0 60px rgba(255, 0, 60, 0.5);
    }

    /* VIDEO CONTAINER */
    .video-container {
        width: min(850px, 90vw);
        aspect-ratio: 16 / 9;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #000;

        border: 2px solid #ff003c;
        border-radius: 8px;

        box-shadow:
            0 0 10px #ff003c,
            0 0 30px rgba(255, 0, 60, 0.6),
            inset 0 0 30px rgba(255, 0, 60, 0.05);

        overflow: hidden;
    }

    .video-container video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* OPTIONAL PLACEHOLDER */
    .video-placeholder {
        color: #ff003c;
        font-size: 16px;
        letter-spacing: 2px;
        text-shadow:
            0 0 5px #ff003c,
            0 0 15px #ff003c;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px;
        }

        .back-button {
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
        }

        h1 {
            letter-spacing: 5px;
            margin-bottom: 30px;
        }
    }
</style>
</head>

<body>

<!-- BACK TO PORTFOLIO -->
<a href="portfolio.html" class="back-button">
    ←
</a>

<div class="container">

    <h1>WEATHER APP</h1>

    <!-- VIDEO CONTAINER -->
    <div class="video-container">

        <!-- Replace project1.mp4 with your video file -->
        <video controls>
            <source src="project02.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

    </div>

</div>

</body>
</html>
